volumes:
  pg_data:
  static:  # Volume для статики

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend/
    env_file: .env
    volumes:
      - static:/backend_static  # Монтируем volume для статики

  frontend:
    build: ./frontend/
    env_file: .env
    volumes:
      - static:/frontend_static  # Монтируем volume для статики
    # Переопределяем CMD: копируем статику и завершаем работу
    command: cp -r /app/build/. /frontend_static/

  gateway:
    build: ./gateway/
    ports:
      - 8000:80  # Пробрасываем порт на хост
    volumes:
      - static:/staticfiles/  # Nginx раздаёт статику отсюда
    depends_on:
      - backend
      - frontend